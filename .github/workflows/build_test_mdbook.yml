name: Build and test mdBook

on: [pull_request,workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  Build-mdbook:
    strategy:
        matrix:
            os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: false

      - name: Install mdbook
        run: (test -x $HOME/.cargo/bin/mdbook || cargo install mdbook --no-default-features --features search --vers "^0.5" --locked)

      - name: Install mdbook-toc and mdbook-linkcheck
        run: cargo install mdbook-toc@^0.15 mdbook-linkcheck@^0.7 --locked
  
      - name: Build the book
        run: |
            cd docs
            mdbook build

      - name: Test the book
        run: |
            cd docs
            mdbook test